# Stack dev bang Docker.
#
# May khong cai duoc Docker: xem docs/SETUP-WSL.md - Postgres rootless
# (scripts/pg.sh) + Airflow trong venv rieng (scripts/airflow.sh).
#
# Production nen tach DB metadata cua Airflow ra khoi instance nay.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chi chay khi volume con trong. Lan sau dung `news-bot init-db`.
      # 000 tao DB metadata cho Airflow, 001 tao schema nghiep vu.
      - ./docker/000_airflow_db.sql:/docker-entrypoint-initdb.d/000_airflow_db.sql:ro
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    # Image tu dung: Airflow + mot venv rieng cho app (xem Dockerfile.airflow).
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    # Cau hinh app (key LLM, webhook, khau vi ban tin) lay nguyen tu .env.
    # Nhung gi khac giua host va container duoc ghi de o `environment` ben duoi
    # - environment luon thang env_file.
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://news:news@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      NEWS_APP_PYTHON: /opt/app-venv/bin/python
      # .env tro toi Postgres rootless tren host (127.0.0.1:18432) - trong
      # container phai la service `postgres`.
      POSTGRES_DSN: postgresql+psycopg://news:news@postgres:5432/news
      LOG_JSON: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./config:/opt/news/config:ro
      - ./sql:/opt/news/sql:ro
    ports:
      - "8080:8080"
    command: standalone


  # ===== Quan sat TAI NGUYEN MAY =====
  # Co y khong chong lan trang trang thai (news_bot.status): trang do lo nghiep
  # vu - run, chi phi LLM, suc khoe nguon, dung luong bang. Bon service duoi day
  # chi lo CPU/RAM/dia/mang va runtime cua Postgres.
  #
  # Pipeline khong duoc scrape: no chay 1 lan/ngay trong vai phut, con Prometheus
  # pull moi 15 giay - phan lon luot scrape se truot. So lieu do da o trong
  # Postgres va trang :18081 doc thang tu do.

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    # Can nhin vao namespace cua host moi bao dung, khong phai cua container.
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|host/root/(dev|proc|sys)|var/lib/docker/.+)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    ports:
      - "9100:9100"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://news:news@postgres:5432/news?sslmode=disable"
    ports:
      - "9187:9187"

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/observability/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:11.5.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Stack dev. Xem thi khong can dang nhap; sua dashboard thi admin/admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./config/observability/datasource.docker.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./config/observability/dashboards.docker.yml:/etc/grafana/provisioning/dashboards/news.yml:ro
      - ./config/observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  pgdata:
  promdata:
  grafanadata:
