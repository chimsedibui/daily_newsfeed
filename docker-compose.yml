# Stack dev bang Docker.
#
# May khong cai duoc Docker: xem docs/SETUP-WSL.md - Postgres rootless
# (scripts/pg.sh) + Airflow trong venv rieng (scripts/airflow.sh). Do la cach
# stack nay dang duoc kiem chung.
#
# Production nen tach DB metadata cua Airflow ra khoi DB nghiep vu.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 001_init.sql chi chay khi volume con trong. Lan sau dung `news-bot init-db`.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    # Image tu dung: Airflow + mot venv rieng cho app (xem Dockerfile.airflow).
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://news:news@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      NEWS_APP_PYTHON: /opt/app-venv/bin/python
      # Bien moi truong cua app - task external_python ke thua tu day.
      POSTGRES_DSN: postgresql+psycopg://news:news@postgres:5432/news
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CHAT_WEBHOOK_URL: ${GOOGLE_CHAT_WEBHOOK_URL:-}
      SUMMARIZER_MODEL: ${SUMMARIZER_MODEL:-gpt-5.6-terra}
      EDITOR_MODEL: ${EDITOR_MODEL:-gpt-6-astra}
      DRY_RUN: ${DRY_RUN:-false}
      LOG_JSON: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./config:/opt/news/config:ro
      - ./sql:/opt/news/sql:ro
    ports:
      - "8080:8080"
    command: standalone

volumes:
  pgdata:
