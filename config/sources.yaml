# Danh mục nguồn tin.
#
# group quyết định bài đi vào bản tin nào:
#   serious -> công nghệ, AI/paper, chính trị thế giới, chứng khoán, quỹ, FED
#   life    -> xe cộ, du lịch, bóng đá, bóng chuyền
# Thời tiết là bản tin thứ ba, không lấy từ feed (xem src/news_bot/weather.py).
#
# strategy:
#   rss        -> parse feed XML
#   sitemap    -> đọc news sitemap (khi site không mở RSS)
#   hf_papers  -> API daily papers của Hugging Face (JSON, đã xếp hạng theo upvote)
#   github_trending -> GitHub Search API (JSON). {since} trong URL được thay bằng
#                      ngày đầu của cửa sổ thời gian.
#
# Trạng thái mọi URL dưới đây đã được gọi thật ngày 20/09/2026.
# lookback_hours: cua so thoi gian rieng cho nguon xuat ban thua (FED, blog hang
# AI, paper). Khong co thi dung LOOKBACK_HOURS chung trong .env.
# Bo loc already_sent_urls() dam bao mot bai chi len ban tin dung mot lan.
defaults:
  strategy: rss
  fulltext: true
  weight: 1.0
  timeout_s: 20
  group: serious

sources:
  # ============================================================
  # AI / PAPER / KIẾN TRÚC MÔ HÌNH
  # ============================================================
  # Daily papers của Hugging Face: paper đã được cộng đồng upvote, tức là đã lọc
  # sẵn. Dùng cái này thay vì firehose arXiv (~500 paper/ngày, hầu hết không liên quan).
  - id: hf_daily_papers
    lookback_hours: 96
    publisher: Hugging Face Papers
    category: ai-paper
    strategy: hf_papers
    url: https://huggingface.co/api/daily_papers
    weight: 1.6
    max_items: 20
    fulltext: false        # summary trong API đã là abstract, không cần fetch thêm

  - id: openai_news
    lookback_hours: 120
    publisher: OpenAI
    category: ai
    url: https://openai.com/news/rss.xml
    weight: 1.5
    max_items: 15
  - id: deepmind_blog
    lookback_hours: 168
    publisher: Google DeepMind
    category: ai
    url: https://deepmind.google/blog/rss.xml
    weight: 1.5
    max_items: 15
  - id: hf_blog
    lookback_hours: 168
    publisher: Hugging Face
    category: ai
    url: https://huggingface.co/blog/feed.xml
    weight: 1.3
    max_items: 15

  # arXiv thô: ~500 paper/ngày, và feed rỗng vào T7/CN (<skipDays>).
  # Bật khi cần theo dõi sâu một chuyên mục, kèm max_items thật chặt.
  - id: arxiv_cs_cl
    lookback_hours: 72
    publisher: arXiv cs.CL
    category: ai-paper
    url: https://rss.arxiv.org/rss/cs.CL
    max_items: 25
    fulltext: false
    enabled: false

  - id: mistral_news
    lookback_hours: 168
    publisher: Mistral AI
    category: ai
    url: https://mistral.ai/rss.xml
    weight: 1.4
    max_items: 15
  - id: google_ai_blog
    lookback_hours: 168
    publisher: Google AI
    category: ai
    url: https://blog.google/technology/ai/rss/
    weight: 1.4
    max_items: 15

  # Blog ky thuat doc ky mot minh dang gia bang ca chuc tin PR.
  - id: simonwillison
    lookback_hours: 72
    publisher: Simon Willison
    category: ai
    url: https://simonwillison.net/atom/everything/
    weight: 1.3
    max_items: 20

  # Newsletter tuan -> cua so 2 tuan, lay it muc.
  - id: import_ai
    lookback_hours: 336
    publisher: Import AI
    category: ai
    url: https://importai.substack.com/feed
    weight: 1.5
    max_items: 5

  # Hacker News da loc theo diem: tin cong nghe nao that su duoc chu y.
  - id: hn_ai
    lookback_hours: 72
    publisher: Hacker News
    category: cong-nghe
    url: "https://hnrss.org/newest?q=LLM+OR+GPT+OR+diffusion&points=100"
    weight: 1.2
    max_items: 20
    fulltext: false      # link tro ra ngoai, chat luong trich xuat khong dam bao
  - id: hn_frontpage
    lookback_hours: 48
    publisher: Hacker News
    category: cong-nghe
    url: "https://hnrss.org/frontpage?points=150"
    weight: 1.1
    max_items: 15
    fulltext: false

  # Khong them (da goi thu ngay 20/09/2026, deu khong dung duoc):
  #   ai.meta.com/blog/rss        404
  #   anthropic.com/news/rss.xml  404
  #   deeplearning.ai The Batch   404
  #   imf.org RSS                 403
  #   worldbank.org, bis.org      404
  #   qwenlm.github.io            200 nhung bai moi nhat tu 09/2025 -> dong bang

  # ============================================================
  # CÔNG NGHỆ
  # ============================================================
  - id: theverge
    publisher: The Verge
    category: cong-nghe
    url: https://www.theverge.com/rss/index.xml
    weight: 1.2
  - id: arstechnica
    publisher: Ars Technica
    category: cong-nghe
    url: https://feeds.arstechnica.com/arstechnica/index
    weight: 1.2
  - id: techcrunch
    publisher: TechCrunch
    category: cong-nghe
    url: https://techcrunch.com/feed/
    weight: 1.1
  - id: mit_tech_review
    lookback_hours: 96
    publisher: MIT Technology Review
    category: cong-nghe
    url: https://www.technologyreview.com/feed/
    weight: 1.3
  - id: vnexpress_khcn
    publisher: VnExpress
    category: cong-nghe
    url: https://vnexpress.net/rss/khoa-hoc-cong-nghe.rss
    weight: 1.2

  # GitHub: repo mới lên sao nhanh. Tín hiệu trend thật - người ta bấm sao vì
  # dùng được, không phải vì ai đó trả tiền PR. Không cần token.
  - id: github_trending
    lookback_hours: 336
    publisher: GitHub Trending
    category: cong-nghe
    strategy: github_trending
    url: "https://api.github.com/search/repositories?q=created:>{since}+stars:>300&sort=stars&order=desc&per_page=20"
    weight: 1.3
    max_items: 20
    fulltext: false        # README khong phai bai bao, trich xuat se ra rac
    # GitHub tra 415 neu Accept khong phai kieu cua no (client dung chung gui
    # Accept cua RSS).
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"

  # ============================================================
  # CHÍNH TRỊ THẾ GIỚI
  # ============================================================
  - id: bbc_world
    publisher: BBC World
    category: the-gioi
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    weight: 1.3
  - id: aljazeera
    publisher: Al Jazeera
    category: the-gioi
    url: https://www.aljazeera.com/xml/rss/all.xml
    weight: 1.1
    max_items: 25
  - id: nyt_world
    publisher: New York Times
    category: the-gioi
    url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml
    weight: 1.2
    max_items: 30
  - id: vnexpress_the_gioi
    publisher: VnExpress
    category: the-gioi
    url: https://vnexpress.net/rss/the-gioi.rss

  # ============================================================
  # FED / QUỸ / THỊ TRƯỜNG QUỐC TẾ
  # ============================================================
  # FED công bố thẳng, không qua trung gian diễn giải -> weight cao nhất.
  - id: fed_monetary
    lookback_hours: 168
    publisher: Federal Reserve
    category: fed
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    weight: 2.0
  - id: fed_press_all
    lookback_hours: 120
    publisher: Federal Reserve
    category: fed
    url: https://www.federalreserve.gov/feeds/press_all.xml
    weight: 1.6
  - id: fed_speeches
    lookback_hours: 120
    publisher: Federal Reserve
    category: fed
    url: https://www.federalreserve.gov/feeds/speeches.xml
