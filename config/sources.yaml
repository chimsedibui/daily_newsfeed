  - id: ecb_press
    lookback_hours: 168
    publisher: ECB
    category: ngan-hang-trung-uong
    url: https://www.ecb.europa.eu/rss/press.html
    weight: 1.6
    max_items: 15
  - id: sec_press
    lookback_hours: 168
    publisher: SEC
    category: quy-dau-tu
    url: https://www.sec.gov/news/pressreleases.rss
