# Danh mục nguồn tin. Mỗi entry = 1 feed.
# strategy:
#   rss      -> parse feed XML (rẻ nhất, ưu tiên)
#   sitemap  -> đọc <urlset> news sitemap (dùng khi site không mở RSS)
# fulltext: true -> fetch trang bài viết (SSR HTML) để lấy JSON-LD + body
defaults:
  strategy: rss
  fulltext: true
  weight: 1.0
  timeout_s: 20

sources:
  # ---------- VnExpress (RSS mở, ổn định nhất trong các báo VN) ----------
  - id: vnexpress_tin_moi
    publisher: VnExpress
    category: tong-hop
    url: https://vnexpress.net/rss/tin-moi-nhat.rss
    weight: 1.2
  - id: vnexpress_kinh_doanh
    publisher: VnExpress
    category: kinh-doanh
    url: https://vnexpress.net/rss/kinh-doanh.rss
    weight: 1.3
  - id: vnexpress_khcn
    publisher: VnExpress
    category: cong-nghe
    url: https://vnexpress.net/rss/khoa-hoc-cong-nghe.rss
    weight: 1.4
  - id: vnexpress_startup
    publisher: VnExpress
    category: startup
    url: https://vnexpress.net/rss/startup.rss
    weight: 1.2
  - id: vnexpress_the_gioi
    publisher: VnExpress
    category: the-gioi
    url: https://vnexpress.net/rss/the-gioi.rss
  - id: vnexpress_en
    publisher: VnExpress English
    category: tong-hop-en
    url: https://e.vnexpress.net/rss/news.rss
    enabled: false

  # ---------- Tuổi Trẻ ----------
  - id: tuoitre_tin_moi
    publisher: Tuổi Trẻ
    category: tong-hop
    url: https://tuoitre.vn/rss/tin-moi-nhat.rss
  - id: tuoitre_kinh_doanh
    publisher: Tuổi Trẻ
    category: kinh-doanh
    url: https://tuoitre.vn/rss/kinh-doanh.rss

  # ---------- Thanh Niên ----------
  - id: thanhnien_home
    publisher: Thanh Niên
    category: tong-hop
    url: https://thanhnien.vn/rss/home.rss

  # ---------- Dân Trí ----------
  - id: dantri_home
    publisher: Dân Trí
    category: tong-hop
    url: https://dantri.com.vn/rss/home.rss
  - id: dantri_suc_manh_so
    publisher: Dân Trí
    category: cong-nghe
    url: https://dantri.com.vn/rss/suc-manh-so.rss

  # ---------- VietnamNet (không có feed "tin-moi-nhat", phải đi theo chuyên mục) ----------
  - id: vietnamnet_thoi_su
    publisher: VietnamNet
    category: thoi-su
    url: https://vietnamnet.vn/rss/thoi-su.rss
    max_items: 25
  - id: vietnamnet_cong_nghe
    publisher: VietnamNet
    category: cong-nghe
    url: https://vietnamnet.vn/rss/cong-nghe.rss
    max_items: 25

  # ---------- CafeF (tài chính / chứng khoán) ----------
  - id: cafef_chung_khoan
    publisher: CafeF
    category: tai-chinh
    url: https://cafef.vn/thi-truong-chung-khoan.rss
    weight: 1.3
  - id: cafef_vi_mo
    publisher: CafeF
    category: vi-mo
    url: https://cafef.vn/vi-mo-dau-tu.rss

  # ---------- Nguồn chặn RSS: dùng news sitemap ----------
  - id: znews_sitemap
    publisher: ZNews
    category: tong-hop
    strategy: sitemap
    url: https://znews.vn/sitemaps/news.xml
    enabled: false   # bật sau khi xác nhận đường dẫn sitemap hiện hành
