# Ban cho docker-compose: target la TEN SERVICE, khong phai loopback.
# Ban rootless (WSL, khong Docker) duoc render tu prometheus.yml -> .obs/.
#
# Van chi scrape tai nguyen. Pipeline khong co endpoint /metrics va co y nhu vay:
# job chay 1 lan/ngay vai phut, mo hinh pull se truot gan het luot scrape.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: news-bot

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: docker

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
